---
name: 'mammutmw/usc-gha'
description: 'Upload files with the upload service client'
branding:
  icon: 'upload'
  color: 'red'
inputs:
  aws_access_key:
    description: 'The AWS_ACCESS_KEY_ID'
    required: false
  aws_secret_access_key:
    description: 'The AWS_SECRET_ACCESS_KEY'
    required: false
  cmd:
    description: 'The command to run'
    required: true
    default: 'upload'
  debug:
    description: 'Debug output'
    required: false
    default: 'false'
  src:
    description: 'root directory of files'
    required: false
    default: ''
  ignore_empty:
    description: 'ignore errors cause by empty file list'
    required: false
    default: 'false'
  dry:
    description: 'dry run, only output files to be uploaded'
    required: false
    default: 'false'
  files:
    description: 'Comma-separated list of files to wait upload'
    required: false
    default: ''
  target:
    description: 'The target site and (optionally) directory'
    required: false
  timeout:
    description: 'timeout in seconds (default 60)'
    required: false
    default: '60'
  verbose:
    description: 'verbose output'
    required: false
    default: 'true'
  wait:
    description: 'wait until files are uploaded'
    required: false
    default: 'false'
  recursive:
    description: 'Recursively include sub directories'
    required: false
    default: 'false'
  info_git:
    description: 'Git repository of this project'
    required: false
  info_slack:
    description: 'Slack channel of this project'
    required: false
  info_email:
    description: 'Email address of this project or person responsible'
    required: false
  info_team:
    description: 'Team name of this project'
    required: false
  info_product:
    description: 'Product name of this project'
    required: false
  newer:
    description: 'Files must be newer than this date, format: https://github.com/tj/go-naturaldate/blob/master/naturaldate_test.go'
    required: false
  older:
    description: 'Files must be older than this date, format: https://github.com/tj/go-naturaldate/blob/master/naturaldate_test.go'
    required: false
  includes:
    description: 'Files must match this regexp'
    required: false
  excludes:
    description: 'Files must NOT match this regexp'
    required: false
  extra_options:
    description: 'Extra options not supported by all commands'
    required: false
    default: ''
  oidc_role_arn:
    description: 'IAM role to assume via OIDC. Accepts either a short name (e.g. "xyz", expanded to arn:aws:iam::179942336946:role/xyz-oidc-role) or a full ARN. If set, AWS OIDC authentication is performed before the upload. Mutually exclusive with aws_access_key/aws_secret_access_key.'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Resolve OIDC role ARN
      if: ${{ inputs.oidc_role_arn != '' }}
      id: resolve_role
      shell: bash
      run: |
        role='${{ inputs.oidc_role_arn }}'
        if [[ "$role" != arn:* ]]; then
          role="arn:aws:iam::179942336946:role/${role}-oidc-role"
        fi
        echo "arn=$role" >> "$GITHUB_OUTPUT"

    - name: Configure AWS credentials via OIDC
      if: ${{ inputs.oidc_role_arn != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ steps.resolve_role.outputs.arn }}
        aws-region: eu-west-1

    - name: Upload with USC
      shell: bash
      env:
        USC_CMD: ${{ inputs.cmd }}
        USC_DEBUG: ${{ inputs.debug }}
        USC_SRC: ${{ inputs.src }}
        USC_IGNORE_EMPTY: ${{ inputs.ignore_empty }}
        USC_DRY: ${{ inputs.dry }}
        USC_FILES: ${{ inputs.files }}
        USC_TARGET: ${{ inputs.target }}
        USC_TIMEOUT: ${{ inputs.timeout }}
        USC_VERBOSE: ${{ inputs.verbose }}
        USC_WAIT: ${{ inputs.wait }}
        USC_RECURSIVE: ${{ inputs.recursive }}
        USC_INFO_GIT: ${{ inputs.info_git }}
        USC_INFO_SLACK: ${{ inputs.info_slack }}
        USC_INFO_EMAIL: ${{ inputs.info_email }}
        USC_INFO_TEAM: ${{ inputs.info_team }}
        USC_INFO_PRODUCT: ${{ inputs.info_product }}
        USC_NEWER: ${{ inputs.newer }}
        USC_OLDER: ${{ inputs.older }}
        USC_INCLUDES: ${{ inputs.includes }}
        USC_EXCLUDES: ${{ inputs.excludes }}
        USC_EXTRA_OPTIONS: ${{ inputs.extra_options }}
        USC_OIDC_ROLE_ARN: ${{ inputs.oidc_role_arn }}
        USC_AWS_ACCESS_KEY: ${{ inputs.aws_access_key }}
        USC_AWS_SECRET_KEY: ${{ inputs.aws_secret_access_key }}
      run: |
        if [[ -n "$USC_OIDC_ROLE_ARN" && ( -n "$USC_AWS_ACCESS_KEY" || -n "$USC_AWS_SECRET_KEY" ) ]]; then
          echo "oidc_role_arn cannot be combined with aws_access_key or aws_secret_access_key" >&2
          exit 1
        fi

        export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-$USC_AWS_ACCESS_KEY}"
        export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-$USC_AWS_SECRET_KEY}"

        if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
          echo "Provide aws_access_key/aws_secret_access_key or oidc_role_arn" >&2
          exit 1
        fi

        extra_args=()
        if [[ -n "$USC_EXTRA_OPTIONS" ]]; then
          read -ra extra_args <<< "$USC_EXTRA_OPTIONS"
        fi

        docker run --rm \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          -w "$GITHUB_WORKSPACE" \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -e AWS_SESSION_TOKEN \
          ghcr.io/mammutmw/usc \
          "$USC_CMD" \
          "--debug=$USC_DEBUG" \
          "--src=$USC_SRC" \
          "--ignore-empty=$USC_IGNORE_EMPTY" \
          "--dry=$USC_DRY" \
          "--files=$USC_FILES" \
          "--target=$USC_TARGET" \
          "--timeout=$USC_TIMEOUT" \
          "--verbose=$USC_VERBOSE" \
          "--wait=$USC_WAIT" \
          "--recursive=$USC_RECURSIVE" \
          "--info-git=$USC_INFO_GIT" \
          "--info-slack=$USC_INFO_SLACK" \
          "--info-email=$USC_INFO_EMAIL" \
          "--info-team=$USC_INFO_TEAM" \
          "--info-product=$USC_INFO_PRODUCT" \
          "--newer=$USC_NEWER" \
          "--older=$USC_OLDER" \
          "--includes=$USC_INCLUDES" \
          "--excludes=$USC_EXCLUDES" \
          "${extra_args[@]}"
